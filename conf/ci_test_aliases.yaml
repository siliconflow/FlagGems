# Operator test aliases
#
# Maps operator IDs to their actual test file names when the standard
# naming convention (tests/test_<id>.py) does not apply.
#
# Common cases:
#   - _out variants share test with the base operator
#   - Compound operators (e.g., arange_start_step) tested in a shared file
#   - Operators with special naming (leading underscore, etc.)
#
# Format:
#   <operator_id>: <test_file_stem>  (without tests/ prefix and .py suffix)
#
# Example:
#   addmm_out: test_addmm
#   means tests/test_addmm.py covers the addmm_out operator

# _out variants - share test with base operator
addcdiv_out: test_addcdiv
addcmul_out: test_addcmul
addmm_dtype_out: test_addmm
addmm_out: test_addmm
addmv_out: test_addmv
alias_copy_out: test_alias_copy
arccosh_out: test_acosh
arcsin_out: test_asin
arcsinh_out: test_asinh
arctanh_out: test_atanh
as_strided_copy_out: test_as_strided_copy
atan2_out: test_atan2
baddbmm_out: test_baddbmm
int_mm_out: test_int_mm
multi_margin_loss_out: test_multi_margin_loss
nanmedian_out: test_nanmedian
scaled_mm_out: test_scaled_mm
scatter_reduce_two_out: test_scatter_reduce
searchsorted_out: test_searchsorted
searchsorted_scalar_out: test_searchsorted
segment_reduce_out: test_segment_reduce
special_zeta_out: test_special_zeta
special_zeta_scalar_tensor_out: test_special_zeta
special_zeta_tensor_scalar_out: test_special_zeta

# Compound / alternative names
addmm_dtype: test_addmm
all_dim: test_all
all_dims: test_all
and_scalar: test_bitwise_and_scalar
and_tensor: test_bitwise_and
any_dim: test_any
any_dims: test_any
arange_start_step: test_arange
arctan: test_atan
nanmedian_dim: test_nanmedian
nanmedian_dim_values: test_nanmedian
scatter_reduce_two: test_scatter_reduce
scatter_reduce_two_: test_scatter_reduce
searchsorted_scalar: test_searchsorted
special_zeta_scalar_tensor: test_special_zeta
special_zeta_tensor_scalar: test_special_zeta

# Operators tested in combined files or with different naming
batch_norm_backward: test_batch_norm
batch_norm_impl_index: test_batch_norm
multi_margin_loss_backward: test_multi_margin_loss
multi_margin_loss_backward_out: test_multi_margin_loss
segment_reduce_backward: test_segment_reduce
segment_reduce_backward_out: test_segment_reduce
std_mean_correction: test_std_mean
std_mean_correction_names: test_std_mean
std_mean_correction_out: test_std_mean
std_mean_dim: test_std_mean
std_mean_names_dim: test_std_mean
tril_indices: test_triangular_indices
triu_indices: test_triangular_indices
upsample_bicubic2d_aa_backward: test_upsample_bicubic2d_aa
upsample_linear1d_backward: test_upsample_linear1d

# Underscore-prefixed aten op shares the base operator test file
_adaptive_avg_pool3d_backward: test_adaptive_avg_pool3d_backward
